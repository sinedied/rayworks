  <title id="rayburn-dark-title">Ray|Burn - Dark-background variant</title>
  <desc id="rayburn-dark-desc">The Ray|Burn wordmark for dark backgrounds: near-white Ray lettering with an orange vertical separator and orange Burn lettering. A tall asymmetric near-white flame sits in the open space inside the lowercase u, separated from both stems and the curved bowl. The uppercase B counters, background, and space around the flame are transparent.</desc>

