id: raydeck
name: raydeck
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://fond-moor-c78aa9941b-swedencentral.webapp.fabricapps.net
  data:
    enabled: false
    dialect: mssql
  staticHosting:
    enabled: true
    assetAccess: public
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    enabled: false
